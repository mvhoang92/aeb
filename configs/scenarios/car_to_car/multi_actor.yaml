scenarios:
- id: multi_adjacent_decoy_65
  description: Xe mồi đứng gần ở làn trái, xe chậm cùng làn mới là hazard.
  type: multi_actor
  control_modes:
  - physics
  ego_speed_kph: 65.0
  duration_s: 10.0
  lane_follow: true
  max_lane_offset_m: 1.25
  expected_brake: true
  expected_brake_actor: lead
  expected_collision: false
  actors:
  - role: adjacent_decoy
    hazard: false
    motion: stationary
    speed_kph: 0.0
    initial_gap_m: 20.0
    spawn_lane: left
  - role: lead
    hazard: true
    motion: moving
    speed_kph: 30.0
    initial_gap_m: 48.0
    spawn_lane: ego
    lane_follow: true
- id: multi_two_leads_80
  description: Hai xe cùng làn, AEB phải chọn xe gần đang chạy chậm.
  type: multi_actor
  control_modes:
  - physics
  ego_speed_kph: 80.0
  duration_s: 10.0
  lane_follow: true
  max_lane_offset_m: 1.25
  expected_brake: true
  expected_brake_actor: near_lead
  expected_collision: false
  actors:
  - role: near_lead
    hazard: true
    motion: moving
    speed_kph: 40.0
    initial_gap_m: 42.0
    spawn_lane: ego
    lane_follow: true
  - role: far_lead
    hazard: false
    motion: stationary
    speed_kph: 0.0
    initial_gap_m: 72.0
    spawn_lane: ego
