# Pre-registered local perturbations around representative development cases.
# Each ID is a distinct condition; repeats measure consistency, not independence.
runner:
  map: Town04
  spawn_index: 18
  fixed_delta_seconds: 0.05
  sensor_wait_timeout_s: 1.0
  settle_ticks: 4
  stop_speed_mps: 0.3
  stop_hold_time_s: 0.5
  control_mode: physics
  physics_velocity_lock: true
  physics_speed_kp: 0.35
  physics_speed_ki: 0.0
  physics_speed_integral_limit: 3.0
  physics_throttle_feedforward: 0.18
  physics_throttle_limit: 0.70
  physics_brake_limit: 0.40
  physics_speed_deadband_mps: 0.4
