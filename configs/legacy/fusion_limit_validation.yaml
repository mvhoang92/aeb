    description: Operating range - ego 40 km/h, xe đứng yên cùng làn, gap 40 m.
    type: stationary_lead
    ego_speed_kph: 40.0
    target_speed_kph: 0.0
    initial_gap_m: 40.0
    duration_s: 8.0
    expected_brake: true
    expected_collision: false
    min_stop_gap_m: 0.5

