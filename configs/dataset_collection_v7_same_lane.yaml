world:
  map: Town04
  load_map: true
  fixed_delta_seconds: 0.05

traffic_manager:
  port: 8000
  global_distance_to_leading_vehicle_m: 2.5
  global_speed_difference_percent: 0.0
  seed: 2026

traffic:
  spawn_vehicles: true
  # Với dataset v7, số xe tổng bằng số xe cùng làn để không sinh xe ngẫu nhiên
  # ở làn bên cạnh.
  number_of_vehicles: 4
  actor_filter: vehicle.*
  safe_blueprints: true
  car_lights_on: false
  same_lane_vehicles_ahead: 4
  same_lane_first_distance_m: 30.0
  same_lane_spacing_m: 35.0
  same_lane_following_distance_m: 12.0

ego:
  blueprint: vehicle.tesla.model3
  role_name: hero
  spawn_index: 143
  autopilot: true
  auto_lane_change: false

camera:
  image_size_x: 1280
  image_size_y: 720
  fov: 70
  sensor_tick: 0.0
  gamma: 2.2
  enable_postprocess_effects: true
  location:
    x: 0.43
    y: 0.0
    z: 1.35
  rotation:
    pitch: 0.0
    yaw: 0.0
    roll: 0.0

dataset:
  root: aeb/dataset_v7_same_lane
  split: train
  class_id: 0
  class_name: car
  save_interval_frames_min: 40
  save_interval_frames_max: 40
  max_samples: 2000
  settle_frames: 10
  save_empty_images: true
  empty_frame_keep_ratio: 0.15
  save_previews: true
  show_preview_window: false
  jpeg_quality: 95
  random_seed: 2026

filter:
  actor_pattern: vehicle.*
  minimum_wheels: 4
  max_distance_m: 110.0
  near_plane_m: 0.10
  min_box_width_px: 5
  min_box_height_px: 4
  min_box_area_px: 25
  max_truncation: 0.85
  use_depth_visibility: true
  use_semantic_visibility: true
  vehicle_semantic_tag: 10
  depth_tolerance_m: 2.5
  fit_box_to_visible_pixels: true
  visible_box_padding_px: 2
  min_visible_pixels: 8
  min_visible_ratio: 0.03
  heavy_occlusion_visible_ratio: 0.15
  heavy_occlusion_min_visible_pixels: 300
  heavy_occlusion_min_fitted_area_px: 1000
  suppress_overlapping_boxes: true
  overlap_suppression_iou: 0.55
  overlap_suppression_containment: 0.75
