<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs>
    <marker id="arrowPath" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7e57c2"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #17324d; }
      .h { font: 700 20px Arial, sans-serif; fill: #17324d; }
      .txt { font: 18px Arial, sans-serif; fill: #263238; }
      .small { font: 15px Arial, sans-serif; fill: #37474f; }
      .mono { font: 16px "DejaVu Sans Mono", monospace; fill: #263238; }
      .road { fill: #4b5158; }
      .lane { stroke: #ffffff; stroke-width: 4; stroke-dasharray: 34 26; opacity: 0.85; }
      .edge { stroke: #f6d55c; stroke-width: 5; }
      .ego { fill: #24364f; stroke: #102033; stroke-width: 3; rx: 10; }
      .corridor { fill: #7e57c2; opacity: 0.18; stroke: #7e57c2; stroke-width: 3; stroke-dasharray: 9 7; }
      .path { fill: none; stroke: #7e57c2; stroke-width: 7; marker-end: url(#arrowPath); }
      .ok { fill: #2ecc71; stroke: #ffffff; stroke-width: 3; }
      .risk { fill: #e53935; stroke: #ffffff; stroke-width: 3; }
      .decoy { fill: #9ea7ad; stroke: #ffffff; stroke-width: 2; }
      .panel { fill: #f7fbff; stroke: #9bb7cc; stroke-width: 2; rx: 18; }
      .eq { fill: #fff7e6; stroke: #f0b45a; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="title">Dự đoán quỹ đạo ego và lọc mục tiêu theo hành lang di chuyển</text>

  <rect x="55" y="85" width="700" height="520" class="road" rx="18"/>
  <line x1="160" y1="95" x2="160" y2="595" class="edge"/>
  <line x1="640" y1="95" x2="640" y2="595" class="edge"/>
  <line x1="320" y1="95" x2="320" y2="595" class="lane"/>
  <line x1="480" y1="95" x2="480" y2="595" class="lane"/>

  <path d="M350,575 C360,470 400,370 458,280 C505,207 568,152 624,112 L706,178 C635,232 575,292 535,365 C493,443 475,523 474,598 Z" class="corridor"/>
  <path d="M365,575 C378,462 421,358 475,276 C520,208 580,151 640,110" class="path"/>

  <rect x="315" y="520" width="72" height="92" class="ego"/>
  <text x="351" y="570" text-anchor="middle" class="small" fill="#ffffff">ego</text>
  <circle cx="351" cy="520" r="10" fill="#ff7043" stroke="#ffffff" stroke-width="3"/>
  <text x="372" y="521" class="small" fill="#ffffff">radar</text>

  <circle cx="493" cy="330" r="13" class="risk"/>
  <text x="512" y="337" class="txt" fill="#ffffff">target nguy hiểm</text>
  <circle cx="565" cy="214" r="11" class="ok"/>
  <text x="583" y="220" class="txt" fill="#ffffff">target hợp lệ</text>
  <circle cx="270" cy="270" r="10" class="decoy"/>
  <text x="190" y="252" class="txt" fill="#ffffff">xe làn bên</text>
  <circle cx="610" cy="430" r="10" class="decoy"/>
  <text x="628" y="436" class="txt" fill="#ffffff">lan can / nhiễu</text>
  <circle cx="250" cy="420" r="8" class="decoy"/>
  <circle cx="660" cy="315" r="8" class="decoy"/>
  <circle cx="585" cy="520" r="8" class="decoy"/>

  <line x1="493" y1="330" x2="465" y2="320" stroke="#ffffff" stroke-width="3"/>
  <text x="402" y="316" class="small" fill="#ffffff">d_path nhỏ</text>
  <line x1="270" y1="270" x2="410" y2="300" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="228" y="300" class="small" fill="#ffffff">d_path lớn</text>

  <rect x="800" y="105" width="330" height="430" class="panel"/>
  <text x="965" y="145" text-anchor="middle" class="h">Nguyên tắc lọc</text>
  <text x="830" y="185" class="txt">1. Sinh quỹ đạo ngắn hạn từ:</text>
  <text x="850" y="215" class="small">vận tốc ego, yaw rate, góc lái</text>
  <rect x="830" y="245" width="270" height="50" class="eq"/>
  <text x="965" y="276" text-anchor="middle" class="mono">kappa = f(v, yaw, steer)</text>
  <text x="830" y="335" class="txt">2. Tạo hành lang AEB quanh quỹ đạo.</text>
  <text x="830" y="375" class="txt">3. Giữ radar object nếu:</text>
  <rect x="830" y="400" width="270" height="50" class="eq"/>
  <text x="965" y="431" text-anchor="middle" class="mono">d_path &lt;= y_AEB</text>
  <text x="830" y="485" class="txt">4. Chỉ target hợp lệ mới được tính TTC</text>
  <text x="850" y="515" class="small">và tham gia quyết định phanh.</text>

  <text x="405" y="636" text-anchor="middle" class="small">Sơ đồ nhìn từ trên xuống: không dùng lane id hoặc ground truth của CARLA.</text>
</svg>
