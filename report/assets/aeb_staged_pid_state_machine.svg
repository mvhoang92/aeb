<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 20px Arial, sans-serif; fill: #111827; }
      .small { font: 16px Arial, sans-serif; fill: #334155; }
      .note { font: 15px Arial, sans-serif; fill: #475569; }
      .state { stroke: #1f2937; stroke-width: 2.2; rx: 16; }
      .arrow { stroke: #1f2937; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">Máy trạng thái AEB nhiều tầng với staged PID</text>

  <rect class="state" x="40" y="145" width="150" height="90" fill="#d9fbe8"/>
  <text x="115" y="182" text-anchor="middle" class="label">SAFE</text>
  <text x="115" y="209" text-anchor="middle" class="small">brake = 0</text>

  <rect class="state" x="235" y="145" width="170" height="90" fill="#fef3c7"/>
  <text x="320" y="178" text-anchor="middle" class="label">WARNING</text>
  <text x="320" y="205" text-anchor="middle" class="small">cảnh báo</text>
  <text x="320" y="226" text-anchor="middle" class="small">chưa phanh</text>

  <rect class="state" x="450" y="145" width="155" height="90" fill="#ffedd5"/>
  <text x="527" y="178" text-anchor="middle" class="label">SOFT</text>
  <text x="527" y="205" text-anchor="middle" class="small">PID giới hạn</text>
  <text x="527" y="226" text-anchor="middle" class="small">phanh nhẹ</text>

  <rect class="state" x="650" y="145" width="165" height="90" fill="#fed7aa"/>
  <text x="733" y="178" text-anchor="middle" class="label">MEDIUM</text>
  <text x="733" y="205" text-anchor="middle" class="small">PID giới hạn</text>
  <text x="733" y="226" text-anchor="middle" class="small">phanh vừa</text>

  <rect class="state" x="860" y="145" width="140" height="90" fill="#fecaca"/>
  <text x="930" y="178" text-anchor="middle" class="label">HARD</text>
  <text x="930" y="205" text-anchor="middle" class="small">phanh mạnh</text>
  <text x="930" y="226" text-anchor="middle" class="small">giới hạn 0.90</text>

  <rect class="state" x="1035" y="145" width="140" height="90" fill="#ef4444"/>
  <text x="1105" y="178" text-anchor="middle" class="label" fill="#ffffff">EMERGENCY</text>
  <text x="1105" y="205" text-anchor="middle" class="small" fill="#ffffff">phanh 1.0</text>
  <text x="1105" y="226" text-anchor="middle" class="small" fill="#ffffff">khẩn cấp</text>

  <rect class="state" x="520" y="365" width="170" height="90" fill="#dbeafe"/>
  <text x="605" y="402" text-anchor="middle" class="label">RELEASE</text>
  <text x="605" y="429" text-anchor="middle" class="small">nhả phanh</text>

  <path class="arrow" d="M190 190 H232"/>
  <path class="arrow" d="M405 190 H447"/>
  <path class="arrow" d="M605 190 H647"/>
  <path class="arrow" d="M815 190 H857"/>
  <path class="arrow" d="M1000 190 H1032"/>

  <text x="212" y="172" text-anchor="middle" class="note">TTC giảm</text>
  <text x="428" y="172" text-anchor="middle" class="note">TTC ≤ brake</text>
  <text x="627" y="172" text-anchor="middle" class="note">margin nhỏ</text>
  <text x="836" y="172" text-anchor="middle" class="note">TTC rất thấp</text>
  <text x="1017" y="172" text-anchor="middle" class="note">nguy cấp</text>

  <path class="arrow dashed" d="M1105 238 C1090 330 755 405 693 410"/>
  <path class="arrow dashed" d="M930 238 C905 315 750 388 693 405"/>
  <path class="arrow dashed" d="M733 238 C720 305 690 350 650 365"/>
  <path class="arrow dashed" d="M527 238 C520 305 540 350 570 365"/>
  <path class="arrow dashed" d="M605 365 C505 315 300 270 115 238"/>

  <text x="820" y="340" text-anchor="middle" class="note">nguy cơ giảm / TTC phục hồi</text>
  <text x="350" y="326" text-anchor="middle" class="note">quay lại SAFE khi không còn target nguy hiểm</text>

  <rect x="60" y="485" width="1080" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="600" y="512" text-anchor="middle" class="small">
    Tầng rủi ro quyết định trần lực phanh; PID quyết định giá trị phanh cụ thể bên trong từng trần.
  </text>
</svg>
